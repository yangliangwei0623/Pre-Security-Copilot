[project]
name = "pre-security-copilot"
version = "0.1.0"
description = "Beijing travel security precheck with traceable rules and Qwen vision"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "jinja2>=3.1,<4",
  "python-multipart>=0.0.20", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "aiosqlite>=0.21,<1", "langchain>=1,<2",
  "langchain-openai>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.28,<1", "pillow>=11,<13", "pillow-heif>=0.22,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "playwright>=1.50,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
